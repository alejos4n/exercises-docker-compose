services:
  # Servicio de Nginx (Único punto de entrada expuesto)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
  # Servicio de la Base de Datos
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      #ruta del host:ruta contenedor
      - ./database:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  # Servicio del Backend
  backend:
    build:
      context: ../example-app
      dockerfile: Dockerfile.backend
    
    environment:
      - PORT=8080
      # El navegador carga la app desde Nginx, así que ese es el origen permitido (CORS)
      - REQUEST_ORIGIN=http://localhost:8000
      # Variables esenciales para que el backend se conecte a Postgres:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=postgres
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

  # Servicio del Frontend (Mantenido de Ejercicios Anteriores)
  frontend:
    build:
      context: ../example-app
      dockerfile: Dockerfile.frontend
      # REACT_APP_BACKEND_URL se resuelve al construir el bundle de React,
      # por eso va como build arg y apunta al proxy (backend ya no expone 8080)
      args:
        - REACT_APP_BACKEND_URL=http://localhost:8000/api
    depends_on:
      - backend
