version: '3.8'

services:
  # Servicio de Nginx (Único punto de entrada expuesto)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
  # Servicio de la Base de Datos
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      #ruta del host:ruta contenedor
      - ./database:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  # Servicio del Backend
  backend:
    build:
      context: ../example-app
      dockerfile: Dockerfile.backend
    
    environment:
      - PORT=8080
      # Variables esenciales para que el backend se conecte a Postgres:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=postgres
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

  # Servicio del Frontend (Mantenido de Ejercicios Anteriores)
  frontend:
    build:
      context: ../example-app
      dockerfile: Dockerfile.frontend

    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8080/api
    depends_on:
      - backend
